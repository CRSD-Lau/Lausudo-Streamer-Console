[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "lausudo-streamer-console"
version = "1.0.0"
description = "A lightweight portrait console for unified Twitch and TikTok LIVE chat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.11,<7",
  "websockets>=16,<18",
  "winrt-Windows.Media.Control==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation.Collections==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Media==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Storage.Streams==3.2.1; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/CRSD-Lau/Lausudo-Streamer-Console"
Documentation = "https://github.com/CRSD-Lau/Lausudo-Streamer-Console#readme"
Issues = "https://github.com/CRSD-Lau/Lausudo-Streamer-Console/issues"
Security = "https://github.com/CRSD-Lau/Lausudo-Streamer-Console/security/policy"

[project.scripts]
streamer-console = "streamer_console.app:main"

[tool.setuptools]
packages = ["streamer_console"]

[tool.setuptools.package-data]
streamer_console = ["assets/*.png", "assets/*.ico"]

[tool.unittest]
start-directory = "tests"
